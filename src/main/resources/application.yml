spring:
  main:
    allow-bean-definition-overriding: true
  server:
    port: 8081
    shutdown: graceful
  datasource:
    url: jdbc:mysql://localhost:3306/monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: root
    password: 520886Jy@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      keepalive-time: 30000
      maximum-pool-size: 15
      # 空闲连接超时，自动回收闲置连接
      idle-timeout: 60000
      # 连接最大生命周期，强制销毁旧连接，解决泄漏堆积
      max-lifetime: 1800000
      # 泄漏检测阈值
      leak-detection-threshold: 30000
      # 等待连接超时时间，避免无限阻塞卡死线程
      connection-timeout: 3000
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
    chunk:
      size: 1000
  lifecycle:
    timeout-per-shutdown-phase: 30s
mybatis:
  configuration:
    map-underscore-to-camel-case: true
ai:
  service:
    url: http://127.0.0.1:5000/ai/detect
